name: Lab Chat a11y fork preflight

on:
  push:
    branches: [codex/6635-preflight]

permissions:
  contents: read

env:
  EXPECTED_PATCH_SHA: 6ae472a1522a7bb489b76ed0d1be99b1480d3d14

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.EXPECTED_PATCH_SHA }}
      - name: Verify tested commit
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_PATCH_SHA"
      - uses: ./.github/actions/setup
      - name: Strict lint
        run: pnpm lint:strict
      - name: Full tests
        run: pnpm test
      - name: Build
        run: pnpm build

  chat-a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.EXPECTED_PATCH_SHA }}
      - name: Verify tested commit
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_PATCH_SHA"
      - uses: ./.github/actions/setup
      - name: Focused scope suites
        run: pnpm exec vitest run .github/scripts/a11y-pr-scope.test.mjs .github/scripts/lib/a11y-story-identity.test.mjs .github/scripts/rtl-audit-coverage.test.mjs
      - name: Build packages
        run: pnpm build
      - name: Typecheck Storybook
        run: pnpm -F @astryxdesign/storybook typecheck
      - name: Build Storybook
        run: pnpm -F @astryxdesign/storybook build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Audit Lab Chat scope
        run: node .github/scripts/accessibility-audit.js --storybook-dir apps/storybook/dist --components lab/Chat --port 6158 --output "$RUNNER_TEMP/astryx-a11y-6635.json" --baseline .github/a11y-baseline.json --fail-on-new
