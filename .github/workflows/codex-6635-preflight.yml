name: Lab Chat a11y fork preflight

on:
  push:
    branches: [codex/6635-preflight]

permissions:
  contents: read

env:
  EXPECTED_PATCH_SHA: 6ae472a1522a7bb489b76ed0d1be99b1480d3d14

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.EXPECTED_PATCH_SHA }}
      - name: Verify tested commit
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_PATCH_SHA"
      - uses: ./.github/actions/setup
      - name: Strict lint
        run: pnpm lint:strict
      - name: Build
        run: pnpm build

  test-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.EXPECTED_PATCH_SHA }}
      - name: Verify tested commit
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_PATCH_SHA"
      - uses: ./.github/actions/setup
      - name: Run UI tests
        run: pnpm vitest run --project ui --exclude packages/core/src/Markdown/Markdown.fr23.perf.test.ts
      - name: Run isolated Markdown benchmark
        run: pnpm vitest run --project ui packages/core/src/Markdown/Markdown.fr23.perf.test.ts --no-file-parallelism

  test-node:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.EXPECTED_PATCH_SHA }}
      - name: Verify tested commit
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_PATCH_SHA"
      - uses: ./.github/actions/setup
      - name: Run Node tests
        run: pnpm vitest run --project node
